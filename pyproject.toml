[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prebuy*"]

[project]
name = "prebuy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "fastapi", "uvicorn", "sqlalchemy>=2", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest", "httpx", "coverage"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# project-local temp dir (the shared Windows one can be locked); asyncio plugin unused and noisy on 3.14
addopts = "--basetemp=.pytest_tmp -p no:asyncio"
